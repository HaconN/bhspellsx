modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"
[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="${mod_authors}" #optional
description='''${mod_description}'''

# Hard dependency on Forge itself.
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Phase 0 registers a spell (AbstractSpell) into irons_spellbooks' own SpellRegistry and
# reads irons_lib's transitive API surface — both are hard requirements, must load first.
# geckolib / traveloptics / bhspells are NOT dependencies yet: Phase 0 doesn't call into
# them (see CLAUDE.md / MERGE.md for when that changes).
[[dependencies.${mod_id}]]
    modId="irons_spellbooks"
    mandatory=true
    versionRange="[1.20.1-3.16.1,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="irons_lib"
    mandatory=true
    versionRange="[1.20.1-1.0.2,)"
    ordering="AFTER"
    side="BOTH"
