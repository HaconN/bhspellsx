modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"
[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="${mod_authors}" #optional
description='''${mod_description}'''

# Hard dependency on Forge itself.
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Registers a spell (AbstractSpell) into irons_spellbooks' own SpellRegistry and reads
# irons_lib's transitive API surface — both hard requirements, must load first.
# geckolib / bhspells are still NOT dependencies: nothing in this repo calls into them yet
# (see CLAUDE.md / MERGE.md for when that changes).
[[dependencies.${mod_id}]]
    modId="irons_spellbooks"
    mandatory=true
    versionRange="[1.20.1-3.16.1,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="irons_lib"
    mandatory=true
    versionRange="[1.20.1-1.0.2,)"
    ordering="AFTER"
    side="BOTH"

# Phase 2B: EmbracingBosomAoe calls traveloptics' AdvancedCylinderParticleManager at runtime
# (server-side VFX), so it's now a real hard dependency, not just a compile-time one.
[[dependencies.${mod_id}]]
    modId="traveloptics"
    mandatory=true
    versionRange="[6.3.0-1.20.1,)"
    ordering="AFTER"
    side="BOTH"
